hca:
  scheduler: slurm

  default_conf:
    nodes: 1
    ntasks: 1
    cpus_per_task: 1
    exclusive: true
    time: "06:00:00" 

  configs:
    - name: "pioneer"
      partition: "pioneer"

    - name: "arriesgado"
      partition: "arriesgado-jammy"

    - name: "bananaf3"
      partition: "bananaf3"

brah:
  scheduler: local

  configs:
    - name: "brah"

baldo:
  scheduler: slurm

  default_conf:
    nodes: 1
    ntasks: 1
    time: "05:00:00" 
    gpus: 0
    nodelist: ['gpu00']

  configs:
    - name: "baldo"
      partition: "long"
      account: "flavio.vella"
      cpus_per_task: "1"