variables:
  partition: ["ib", "eth"]
  nodes: [2, 4, 6, 8]

haicgu:
  scheduler: slurm

  default_conf:
    cpus_per_task: 128
    time: "00:30:00"
    account: "dcn"
    gpus: 0
    modules: 
      - "GCC/14.1.0"
      - "OpenMPI/5.0.3"

  configs:
    - name: "{partition}_{nodes}nodes"
      partition: "cn-{partition}"
      nodes: "{nodes}"
      ntasks: "{nodes}"