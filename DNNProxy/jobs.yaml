sequential: true

variables:
  nodes: [2, 4, 6, 8]

  models_hardcoded: ['resnet50', 'resnet152', 'dlrm']

  # partition: ["nanjing"]
  # partition: ["leonardo"]
  partition: ["eth", "ib"]

jobs:
  - config: "{partition}_{nodes}nodes"
    config_jobs:
      - tag: "gpt2"
        command: "mpirun -np {nodes} gpt2 48 {nodes}"

      - tag: "bert"
        command: "mpirun -np {nodes} bert 24 {nodes}"

      - tag: "{models_hardcoded}"
        command: "mpirun -np {nodes} {models_hardcoded}"

