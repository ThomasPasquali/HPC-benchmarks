sequential: true

variables:
  nodes: [1, 2, 4, 8]
  models_dp: ['vit_b_16_32', 'vit_b_16_128', 'vit_l_16_32', 'vit_l_16_128', 'vit_h_16_32', 'vit_h_16_128']
  num_buckets: [8, 32, 128]
  #models_fsdp: ['gpt2_l_128', 'gpt2_xl_128']

  # partition: ["boost_usr_prod"] # Leonardo
  partition: ["ib", "eth"] # HAICGU

jobs:
  - config: "{partition}_{nodes}nodes"
    config_jobs:
      - tag: "dp_{partition}_{nodes}nodes"
        command: "mpirun -np {nodes} cpp/data_parallel/dp {models_dp} {num_buckets}"
        #- tag: "fsdp_{partition}_{nodes}nodes"
        #command: "mpirun -np {nodes} cpp/data_parallel/fsdp {models_fsdp} {nodes} {nodes} true"

