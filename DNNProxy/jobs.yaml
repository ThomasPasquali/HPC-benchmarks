sequential: true

variables:
  nodes: [2, 4, 8]

  models_hardcoded: ['resnet152', 'dlrm']

  partition: ["boost_usr_prod"] # Leonardo
  # partition: ["eth", "ib"]

jobs:
  - config: "{partition}_{nodes}nodes"
    config_jobs:
      # - tag: "gpt3" # needs num_stage(same as num_layer) and acc_step_scale
      #   command: "mpirun -np {nodes} gpt3 48 {nodes}"

      - tag: "{models_hardcoded}"
        command: "mpirun -np {nodes} {models_hardcoded}"

