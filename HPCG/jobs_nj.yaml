# Sequential is mandatory
sequential: true

variables:
  nodes: [1, 2, 4, 8]
  partition: ["nanjing"]
  which: ['inter']

preprocess: "mkdir -p hpcg-out; cd hpcg-out; mkdir -p {partition}; cd {partition}; cp ../../hpcg.dat ."
command: "mpirun --allow-run-as-root -x PATH -x LD_LIBRARY_PATH -np {nodes} --hostfile /root/hpc/tpasquali/HPC-benchmarks/NJ/{nodes}hosts_{which} ../../xhpcg"

jobs:
  - config: "{partition}_{nodes}nodes"
    config_jobs:
      - tag: "hpcg_{partition}"
